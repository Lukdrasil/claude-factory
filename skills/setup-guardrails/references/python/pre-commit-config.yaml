# Installed at the target repo root as .pre-commit-config.yaml
# (pip install pre-commit && pre-commit install).
# Fast local loop: auto-fix + format. The hard gate is CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
